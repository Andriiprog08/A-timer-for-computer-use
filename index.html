<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="timer">
        <div class="display" id="display" role="timer" aria-live="off">
            <span id="hours">00</span><span class="sep">:</span><span id="minutes">00</span><span class="sep small">.</span><span class="ms" id="seconds">00</span>
        </div>

        <div class="controls">
            <button class="btn btn-start" id="start" type="button">Start</button>
            <button class="btn btn-pause" id="pause" type="button">Pause</button>
            <button class="btn btn-stop" id="stop" type="button">Stop</button>
        </div>

        <div class="inputs-block">
            <input type="number" id="inH" min="0" placeholder="h" value="0">
            <input type="number" id="inM" min="0" placeholder="m" value="0">
            <input type="number" id="inS" min="0" placeholder="s" value="0">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
